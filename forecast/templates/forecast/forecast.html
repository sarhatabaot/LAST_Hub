{% extends "base.html" %}
{% load static %}

{% block title %}Forecast{% endblock %}

{% block extra_head %}
  <link rel="stylesheet" href="{% static 'forecast/css/style.css' %}">
{% endblock %}

{% block content %}
<section class="page-shell forecast-shell">
  <header class="page-header page-header-tight">
    <div class="page-header-text">
      <p class="eyebrow">Forecast</p>
      <h1 id="pageTitle">Sky forecast</h1>
      <p id="pageSubtitle" aria-busy="true">{{ forecast_data.summary.window_label }}</p>
    </div>
  </header>

  <div id="forecastWarnings" class="note-stack"></div>

  <article id="tonightCard" class="tonight-card" hidden></article>
  <section id="hourlyGrid" class="hourly-grid" hidden></section>
  <section id="outlookStrip" class="outlook-strip" hidden></section>

  <details class="trends-details">
    <summary>Trends &amp; raw series</summary>
    <div id="forecastProviders" class="provider-grid"></div>
    <div id="chartGrid" class="chart-grid"></div>
  </details>
</section>

{{ forecast_data|json_script:"forecast-data" }}

<script src="https://cdn.jsdelivr.net/npm/luxon@3.7.2/build/global/luxon.min.js"></script>
<script type="module" src="{% static 'forecast/js/main.js' %}"></script>
{% endblock %}
