<header class="hub-header" data-hub-header>
  <div class="hub-header-left">
    <a
      href="{% url 'safety:index' %}"
      role="button"
      class="status-pill {% if safety_sidebar.error %}secondary{% elif safety_sidebar.safe %}status-pill-safe{% else %}status-pill-alert{% endif %}"
    >
      Safety: {{ safety_sidebar.label }}
    </a>
    <a
      href="{% url 'checklist:index' %}"
      role="button"
      class="status-pill {% if observatory_status.state == 'open' %}status-pill-open{% else %}secondary{% endif %}"
    >
      Observatory: {{ observatory_status.label }}
    </a>
  </div>

  <div class="hub-header-center">
    <div
      class="hub-skybox"
      data-skybox
      data-lat="{{ OBS_LATITUDE }}"
      data-lon="{{ OBS_LONGITUDE }}"
      data-elevation="{{ OBS_ELEVATION|default:0 }}"
    >
      Loading sky data…
    </div>
  </div>

  <div class="hub-header-right">
    <div class="hub-auth">
      {% if request.user.is_authenticated %}
        {% if request.user.is_staff %}
          <a href="{% url 'admin:index' %}" class="secondary outline compact-button">Admin</a>
        {% endif %}
        <details class="hub-user-menu">
          <summary class="secondary outline hub-user-toggle compact-button">
            {{ request.user.get_username }}
          </summary>
          <div class="hub-user-menu-panel">
            <a href="{% url 'logout' %}" class="secondary">Log out</a>
          </div>
        </details>
      {% else %}
        <a href="{% url 'login' %}" class="secondary compact-button">Log in</a>
      {% endif %}
    </div>
  </div>
</header>
