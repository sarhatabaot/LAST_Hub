<aside class="sidebar" data-hub-sidebar>
  <div class="sidebar-brand">
    <p class="sidebar-kicker">LAST</p>
    <h1>Observatory Hub</h1>
    <p class="sidebar-copy">Operator-first controls and status.</p>
  </div>

  <nav class="sidebar-nav" aria-label="Primary">
    {% for item in primary_navigation %}
      <a
        href="{{ item.url }}"
        class="sidebar-link {% if item.is_active %}is-active{% endif %}"
        {% if item.badge %}data-tooltip="{{ item.badge.tooltip }}" data-placement="right"{% endif %}
      >
        <span class="sidebar-link-label">{{ item.label }}</span>
        {% if item.badge %}<span class="sidebar-badge sidebar-badge-{{ item.badge.variant|default:'wip' }}">{{ item.badge.text }}</span>{% endif %}
      </a>
      {% for child in item.children %}
        <a
          href="{{ child.url }}"
          class="sidebar-link sidebar-sublink"
          {% if child.external %}target="_blank" rel="noopener"{% endif %}
        >
          {{ child.label }}
        </a>
      {% endfor %}
    {% endfor %}
  </nav>

  <div class="sidebar-secondary">
    <p class="sidebar-kicker">Secondary</p>
    <a href="{% url 'hub_resources' %}" class="sidebar-link {% if current_url_name == 'hub_resources' %}is-active{% endif %}">
      Resources
    </a>
    <a href="{% url 'allsky' %}" class="sidebar-link {% if current_url_name == 'allsky' %}is-active{% endif %}">
      AllSky
    </a>
    <a href="{% url 'zorg' %}" class="sidebar-link {% if current_url_name == 'zorg' %}is-active{% endif %}">
      Zorg
    </a>
  </div>

  <footer class="sidebar-footer">
    <a href="{{ PROJECT_SOURCE_URL }}" target="_blank" class="secondary">
      v{{ PROJECT_VERSION }}
    </a>
  </footer>
</aside>
