x-app: &app
  build: .
  image: last-hub
  environment:
    HTTP_PROXY:
    HTTPS_PROXY:
    NO_PROXY:
    DB_PATH: /app/data/db.sqlite3
    ALLOWED_HOSTS: localhost,127.0.0.1,archimedes
    IMS_USERNAME:
    IMS_PASSWORD:
    IMS_BASE_URL: https://data.israel-meteo-service.org
    IMS_DIRECTORY: IMS_ICON
    IMS_DATA_DIR: /app/data/forecast
    IMS_VERIFY_SSL: "false"
    FORECAST_CACHE_PATH: /app/data/forecast.json
    FORECAST_RETENTION_DAYS: "2"
    MEDIAMTX_USERNAME:
    MEDIAMTX_PASSWORD:

  volumes:
    - db-data:/app/data
    - media:/app/media
    - staticfiles:/app/staticfiles

services:
  migrate:
    <<: *app
    command: python manage.py migrate
    restart: "no"

  collectstatic:
    <<: *app
    command: python manage.py collectstatic --noinput
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  import_manuals:
    <<: *app
    command: python manage.py import_manual_md docs/manual
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  forecast_init:
    <<: *app
    command: python manage.py fetch_forecast
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    <<: *app
    ports:
      - "3002:8000"
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.fetch-forecast.schedule: "@every 1h"
      ofelia.job-exec.fetch-forecast.command: "python manage.py fetch_forecast"
    depends_on:
      migrate:
        condition: service_completed_successfully
      collectstatic:
        condition: service_completed_successfully
      import_manuals:
        condition: service_completed_successfully

  ofelia:
    image: mcuadros/ofelia:latest
    command: daemon --docker
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - web

volumes:
  db-data:
  media:
  staticfiles:
